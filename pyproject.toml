[project]
name = "blog"
version = "0.4.0"
description = "Personal blog powered by Wagtail"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "wagtail>=6.0",
    "djangorestframework>=3.15",
    "gunicorn>=23",
    "whitenoise>=6.12.0",
    "django-storages>=1.14.6",
    "boto3>=1.43.6",
]

[dependency-groups]
dev = [
    "ruff>=0.12",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
]
exclude = [
    "**/migrations/**",
    ".venv",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
