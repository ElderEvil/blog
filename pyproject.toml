[project]
name = "blog"
version = "0.7.0"
description = "Personal blog powered by Wagtail"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "wagtail>=8.0,<9.0",
    "djangorestframework>=3.18",
    "gunicorn>=23",
    "whitenoise>=6.12.0",
    "django-storages>=1.14.6",
    "boto3>=1.43.6",
]

[dependency-groups]
dev = [
    "model-bakery>=1.24.0",
    "pytest>=9.1.1",
    "pytest-django>=4.12.0",
    "ruff>=0.12",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "blog_site.settings"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
]
exclude = [
    "**/migrations/**",
    ".venv",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
