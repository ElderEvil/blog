apiVersion: v1
kind: Secret
metadata:
  name: blog-secrets
  namespace: blog
type: Opaque
stringData:
  DJANGO_SECRET_KEY: "change-me-to-a-real-secret-key"
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: "blog.evillab.tech"
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://blog.evillab.tech"
  WAGTAIL_SITE_NAME: "My Blog"
  WAGTAILADMIN_BASE_URL: "https://blog.evillab.tech"
  DATABASE_DIR: "/app/data"
  AWS_ACCESS_KEY_ID: "your-access-key"
  AWS_SECRET_ACCESS_KEY: "your-secret-key"
  AWS_STORAGE_BUCKET_NAME: "blog-media"
  AWS_S3_ENDPOINT_URL: "https://s3-api.evillab.tech"
  DJANGO_SUPERUSER_USERNAME: "admin"
  DJANGO_SUPERUSER_EMAIL: "admin@evillab.tech"
  DJANGO_SUPERUSER_PASSWORD: "change-me"
