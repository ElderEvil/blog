repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: django-migrations-check
        name: django migrations check
        entry: uv run manage.py makemigrations --check --dry-run
        language: system
        types: [python]
        pass_filenames: false
